name: sully-companion

services:
  backend:
    build:
      context: ../../server/companion
    restart: unless-stopped
    init: true
    env_file: .env
    expose:
      - "8787"
    volumes:
      - companion_data:/data
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  trendradar:
    image: wantcat/trendradar:latest
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ${TRENDRADAR_DIR:-/opt/TrendRadar}/config:/app/config:ro
      - trendradar_output:/app/output
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  trendradar-mcp:
    image: wantcat/trendradar-mcp:latest
    restart: unless-stopped
    depends_on:
      - trendradar
    environment:
      TZ: Asia/Shanghai
    expose:
      - "3333"
    volumes:
      - ${TRENDRADAR_DIR:-/opt/TrendRadar}/config:/app/config:ro
      - trendradar_output:/app/output:ro
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_DOMAIN: ${BACKEND_DOMAIN:?Set BACKEND_DOMAIN in .env}
    ports:
      - "80:80"
      # 服务器的 443 由现有 Xray 使用；Caddy 通过 8443 与它共存。
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Cloudflare Tunnel 使用出站连接发布 API，不占用宿主机 443，也不影响 Xray。
  # 控制台里的 Published application Service URL 填 http://backend:8787。
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TUNNEL_TOKEN:?Set CLOUDFLARED_TUNNEL_TOKEN in .env}
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal:

volumes:
  companion_data:
  caddy_data:
  caddy_config:
  trendradar_output:
